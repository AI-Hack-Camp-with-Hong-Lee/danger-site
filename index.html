<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>딱봐도 엄청 위험해보이는 사이트</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #fff;
      }

      main {
        display: grid;
        gap: 32px;
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: clamp(64px, 14vw, 220px);
        font-weight: 900;
        line-height: 0.95;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>딱봐도 엄청 위험해보이는 사이트</h1>
      <h1>당신의 핸드폰은 해킹당했습니다</h1>
    </main>
  </body>
</html>
